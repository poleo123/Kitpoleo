<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descubre tu rutina ideal</title>
<style>
  :root{
    --bg: #EFEEE4;
    --ink: #23281E;
    --ink-soft: #565C4E;
    --accent: #5B6E4E;
    --accent-dark: #3E4C33;
    --clay: #A9714F;
    --card: #FFFFFF;
    --line: #DAD6C7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    line-height:1.5;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:32px 20px 80px;
  }
  header{
    text-align:left;
    padding-bottom:28px;
    border-bottom:1px solid var(--line);
    margin-bottom:32px;
  }
  header h1{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-size:2.1rem;
    font-weight:600;
    margin:0 0 10px;
    color:var(--accent-dark);
  }
  header p{
    color:var(--ink-soft);
    font-size:1.02rem;
    max-width:46ch;
    margin:0;
  }
  .progress{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .question{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px;
    margin-bottom:20px;
  }
  .question h2{
    font-size:1.08rem;
    margin:0 0 16px;
    font-weight:600;
  }
  .option{
    display:block;
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 16px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    font-size:0.97rem;
  }
  .option:hover{ border-color: var(--accent); }
  .option input{ margin-right:10px; accent-color: var(--accent); }
  .option.selected{
    border-color:var(--accent);
    background:#F4F6EF;
  }
  #submitBtn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
  }
  #submitBtn:disabled{
    background:#B9BFAE;
    cursor:not-allowed;
  }
  #submitBtn:not(:disabled):hover{ background:var(--accent-dark); }

  #result{ display:none; }
  .tag{
    display:inline-block;
    background:var(--clay);
    color:#fff;
    padding:5px 14px;
    border-radius:999px;
    font-size:0.85rem;
    margin-bottom:14px;
  }
  #result h2{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-size:1.7rem;
    margin:0 0 8px;
    color:var(--accent-dark);
  }
  #result > p.desc{
    color:var(--ink-soft);
    margin-bottom:26px;
  }
  .routine{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 24px;
    margin-bottom:16px;
  }
  .routine h3{
    margin:0 0 12px;
    font-size:1.05rem;
    color:var(--accent-dark);
  }
  .routine ol{ margin:0; padding-left:20px; }
  .routine li{ margin-bottom:8px; }
  .freq{
    font-size:0.9rem;
    color:var(--ink-soft);
    border-top:1px dashed var(--line);
    margin-top:14px;
    padding-top:12px;
  }
  .tip{
    font-size:0.92rem;
    background:#F4F6EF;
    border-left:3px solid var(--accent);
    padding:12px 16px;
    border-radius:6px;
    margin-top:20px;
  }
  #restartBtn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:0.9rem;
    margin-top:10px;
  }
  #restartBtn:hover{ border-color: var(--accent); color:var(--accent-dark); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Encuentra tu rutina</h1>
    <p>Responde estas preguntas sobre la piel de tu cuerpo (brazos, piernas, espalda, pecho) y al final verás la rutina recomendada con tu exfoliante, splash y bálsamo.</p>
  </header>

  <form id="quizForm">
    <div class="progress" id="progressText">Pregunta 1 de 5</div>
    <div id="questionsContainer"></div>
    <button type="button" id="submitBtn" disabled>Ver mi rutina</button>
  </form>

  <div id="result">
    <span class="tag" id="tipoPiel"></span>
    <h2 id="tituloResultado"></h2>
    <p class="desc" id="descripcionResultado"></p>

    <div class="routine">
      <h3>Rutina de mañana</h3>
      <ol id="rutinaAM"></ol>
    </div>

    <div class="routine">
      <h3>Rutina de noche</h3>
      <ol id="rutinaPM"></ol>
      <p class="freq" id="frecuenciaExfoliante"></p>
    </div>

    <div class="tip" id="tipExtra"></div>

    <button id="restartBtn" type="button">Volver a responder</button>
  </div>

</div>

<script>
// a = seca, b = normal, c = mixta, d = grasa, e = sensible
const preguntas = [
  {
    texto: "¿Cómo sientes la piel de tu cuerpo (brazos, piernas) unas horas después de bañarte?",
    opciones: [
      { letra:"a", texto:"Tirante, áspera o con descamación" },
      { letra:"b", texto:"Cómoda y sin molestias" },
      { letra:"c", texto:"Piernas y brazos normales, pero espalda o pecho brillante" },
      { letra:"d", texto:"Brillante o grasa en gran parte del cuerpo" },
      { letra:"e", texto:"Con ardor, picazón o enrojecimiento" },
    ]
  },
  {
    texto: "¿Notas brillo o grasa en zonas como espalda, pecho o axilas?",
    opciones: [
      { letra:"a", texto:"Casi nunca, incluso se ve opaca o reseca" },
      { letra:"b", texto:"Rara vez" },
      { letra:"c", texto:"Solo en espalda o pecho; el resto del cuerpo normal" },
      { letra:"d", texto:"Sí, con frecuencia en varias zonas" },
      { letra:"e", texto:"Varía mucho, y a veces se enrojece sin razón" },
    ]
  },
  {
    texto: "¿Cómo reacciona tu piel a jabones, cremas o lociones corporales nuevas?",
    opciones: [
      { letra:"a", texto:"Nunca reacciona, pero queda tirante" },
      { letra:"b", texto:"Casi nunca reacciona" },
      { letra:"c", texto:"Solo si es muy graso, y solo en zonas como espalda" },
      { letra:"d", texto:"No se irrita, pero se ve grasa" },
      { letra:"e", texto:"Se irrita o enrojece con frecuencia" },
    ]
  },
  {
    texto: "¿Qué tanto notas sequedad en codos y rodillas, o granitos en el cuerpo?",
    opciones: [
      { letra:"a", texto:"Mucha sequedad en codos, rodillas y piernas" },
      { letra:"b", texto:"Piel pareja, sin mayores molestias" },
      { letra:"c", texto:"Piernas resecas, pero espalda o pecho con granitos" },
      { letra:"d", texto:"Granitos o poros abiertos en espalda, pecho o brazos" },
      { letra:"e", texto:"Pocos granitos, pero sí manchas rojas y sensibilidad" },
    ]
  },
  {
    texto: "¿Cómo sientes tu piel del cuerpo al despertar, antes de bañarte?",
    opciones: [
      { letra:"a", texto:"Áspera, con zonas descamadas en piernas o brazos" },
      { letra:"b", texto:"Fresca, sin brillo excesivo" },
      { letra:"c", texto:"Depende de la zona: unas partes secas, otras brillantes" },
      { letra:"d", texto:"Brillante en varias zonas del cuerpo" },
      { letra:"e", texto:"Enrojecida o con textura irregular" },
    ]
  },
];

const resultados = {
  seca: {
    tag:"Piel seca",
    titulo:"Tu piel es seca",
    desc:"Tu piel del cuerpo produce poca grasa natural y tiende a sentirse tirante, sobre todo en piernas, brazos, codos y rodillas. Necesita hidratación generosa y una exfoliación suave.",
    am:["Aplica el <b>splash</b> con la piel húmeda después de bañarte, para sellar más hidratación.","Sigue con el <b>bálsamo</b> en capa generosa sobre todo el cuerpo, con énfasis en codos y rodillas."],
    pm:["Aplica el <b>splash</b>.","Aplica el <b>bálsamo</b> en capa aún más generosa que en la mañana, especialmente en piernas y brazos."],
    frecExfoliante:"Usa el <b>exfoliante</b> 1 vez por semana, con movimientos suaves.",
    tip:"Aplica el bálsamo mientras la piel todavía está húmeda tras el baño: ayuda a atrapar más agua en la piel."
  },
  normal: {
    tag:"Piel normal",
    titulo:"Tu piel es normal",
    desc:"Tu piel del cuerpo está equilibrada, sin zonas notablemente secas ni grasas. El objetivo es mantener ese equilibrio con una rutina constante.",
    am:["Aplica el <b>splash</b> en todo el cuerpo.","Sigue con el <b>bálsamo</b> en capa media."],
    pm:["Aplica el <b>splash</b>.","Aplica el <b>bálsamo</b> en capa media."],
    frecExfoliante:"Usa el <b>exfoliante</b> 1 a 2 veces por semana.",
    tip:"Mantener la rutina constante, incluso cuando la piel se ve bien, es lo que conserva ese equilibrio."
  },
  mixta: {
    tag:"Piel mixta",
    titulo:"Tu piel es mixta",
    desc:"Tienes zonas más grasas (como espalda, pecho o axilas) y otras más secas (como piernas o brazos). Cada zona necesita una cantidad distinta de producto.",
    am:["Aplica el <b>splash</b> en todo el cuerpo.","Aplica el <b>bálsamo</b> con más énfasis en piernas y brazos, y en capa más ligera en espalda o pecho."],
    pm:["Aplica el <b>splash</b>.","Aplica el <b>bálsamo</b> en todo el cuerpo, reforzando las zonas más secas."],
    frecExfoliante:"Usa el <b>exfoliante</b> 2 veces por semana, con énfasis en las zonas más grasas.",
    tip:"No necesitas productos distintos por zona: basta con ajustar la cantidad de bálsamo según cada parte del cuerpo."
  },
  grasa: {
    tag:"Piel grasa",
    titulo:"Tu piel es grasa",
    desc:"Tu piel produce grasa en exceso en buena parte del cuerpo, especialmente en espalda, pecho o axilas. Aun así necesita hidratación.",
    am:["Aplica el <b>splash</b> para refrescar la piel.","Aplica el <b>bálsamo</b> en capa fina, solo lo necesario."],
    pm:["Aplica el <b>splash</b>.","Aplica el <b>bálsamo</b> en capa fina sobre todo el cuerpo."],
    frecExfoliante:"Usa el <b>exfoliante</b> 2 a 3 veces por semana para ayudar a destapar los poros, sobre todo en espalda y pecho.",
    tip:"No elimines el bálsamo de tu rutina: la piel grasa deshidratada tiende a producir aún más grasa."
  },
  sensible: {
    tag:"Piel sensible",
    titulo:"Tu piel es sensible",
    desc:"Tu piel del cuerpo reacciona con facilidad ante jabones, telas o productos nuevos, con enrojecimiento, ardor o picazón. Necesita una rutina simple y aplicada con suavidad.",
    am:["Aplica una pequeña cantidad de <b>splash</b> y da tiempo a que absorba.","Aplica el <b>bálsamo</b> en capa fina para calmar la piel."],
    pm:["Aplica el <b>splash</b>.","Aplica el <b>bálsamo</b> en capa fina."],
    frecExfoliante:"Usa el <b>exfoliante</b> máximo 1 vez por semana (o cada 10-15 días), con mucha suavidad, y suspéndelo si notas irritación.",
    tip:"Antes de usar un producto nuevo en el cuerpo, pruébalo en una zona pequeña (como el antebrazo) y espera 24 horas para ver si hay reacción."
  }
};

let respuestas = {};

function renderPreguntas(){
  const cont = document.getElementById("questionsContainer");
  cont.innerHTML = "";
  preguntas.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "question";
    const h2 = document.createElement("h2");
    h2.textContent = (i+1) + ". " + p.texto;
    div.appendChild(h2);
    p.opciones.forEach(op => {
      const label = document.createElement("label");
      label.className = "option";
      label.id = "opt-" + i + "-" + op.letra;
      label.innerHTML = '<input type="radio" name="q'+i+'" value="'+op.letra+'"> ' + op.texto;
      label.querySelector("input").addEventListener("change", () => seleccionar(i, op.letra));
      div.appendChild(label);
    });
    cont.appendChild(div);
  });
}

function seleccionar(preguntaIndex, letra){
  respuestas[preguntaIndex] = letra;
  document.querySelectorAll('[id^="opt-'+preguntaIndex+'-"]').forEach(el => el.classList.remove("selected"));
  document.getElementById("opt-"+preguntaIndex+"-"+letra).classList.add("selected");

  const contestadas = Object.keys(respuestas).length;
  document.getElementById("progressText").textContent =
    contestadas < preguntas.length ? "Pregunta " + (contestadas+1) + " de " + preguntas.length : "Todas las preguntas respondidas";
  document.getElementById("submitBtn").disabled = contestadas < preguntas.length;
}

function calcularTipo(){
  const conteo = { a:0, b:0, c:0, d:0, e:0 };
  Object.values(respuestas).forEach(letra => conteo[letra]++);

  const orden = ["a","b","c","d","e"];
  let max = Math.max(...orden.map(l => conteo[l]));
  let topLetras = orden.filter(l => conteo[l] === max);

  // Si "sensible" (e) está entre los empatados, prevalece: una piel reactiva
  // necesita una rutina más suave sin importar lo demás.
  if (topLetras.includes("e") && topLetras.length > 1) return "sensible";

  // Si seca y grasa empatan como máximo, en la práctica es piel mixta.
  if (topLetras.includes("a") && topLetras.includes("d")) return "mixta";

  const letraGanadora = topLetras[0];
  const mapa = { a:"seca", b:"normal", c:"mixta", d:"grasa", e:"sensible" };
  return mapa[letraGanadora];
}

function mostrarResultado(){
  const tipo = calcularTipo();
  const r = resultados[tipo];

  document.getElementById("tipoPiel").textContent = r.tag;
  document.getElementById("tituloResultado").textContent = r.titulo;
  document.getElementById("descripcionResultado").textContent = r.desc;

  document.getElementById("rutinaAM").innerHTML = r.am.map(paso => "<li>"+paso+"</li>").join("");
  document.getElementById("rutinaPM").innerHTML = r.pm.map(paso => "<li>"+paso+"</li>").join("");
  document.getElementById("frecuenciaExfoliante").innerHTML = r.frecExfoliante;
  document.getElementById("tipExtra").innerHTML = "<b>Tip:</b> " + r.tip;

  document.getElementById("quizForm").style.display = "none";
  document.getElementById("result").style.display = "block";
  window.scrollTo({top:0, behavior:"smooth"});
}

document.getElementById("submitBtn").addEventListener("click", mostrarResultado);
document.getElementById("restartBtn").addEventListener("click", () => {
  respuestas = {};
  document.getElementById("result").style.display = "none";
  document.getElementById("quizForm").style.display = "block";
  document.getElementById("progressText").textContent = "Pregunta 1 de 5";
  document.getElementById("submitBtn").disabled = true;
  renderPreguntas();
  window.scrollTo({top:0, behavior:"smooth"});
});

renderPreguntas();
</script>
</body>
</html>
